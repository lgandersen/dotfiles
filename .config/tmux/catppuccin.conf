# Catppuccin Mocha, slanted tabs
set -g @catppuccin_flavour "mocha"

# use the plugin's built-in slanted separators
set -g @catppuccin_window_status_style "slanted"

# show the window name (#W) in every tab, active or not — not the pane
# title (#T), which is whatever the shell last set (e.g. debian@gauss)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# turn the tab's number segment yellow while the window has a pending bell
# (e.g. an agent finished or is waiting for input). Needed because the
# slanted format hard-codes colours, which hides window-status-bell-style.
set -g @catppuccin_window_number_color "#{?window_bell_flag,#{@thm_yellow},#{@thm_overlay_2}}"
set -g @catppuccin_window_current_number_color "#{?window_bell_flag,#{@thm_yellow},#{@thm_mauve}}"

# right status: keep it light — date/time only
set -g @catppuccin_status_datetime_text "%Y-%m-%d %H:%M"
